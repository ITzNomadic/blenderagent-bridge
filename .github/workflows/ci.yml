name: CI

on:
  push:
    branches: [ "main", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Build Wheel & Source Distribution
        run: |
          python -m build

      - name: Verify Wheel Install in Clean Virtualenv
        run: |
          python -m venv test_env
          python -m pip install dist/*.whl

      - name: Run Test Suite
        run: |
          pytest tests/test_security.py tests/test_models.py tests/test_handlers.py tests/test_queue_and_concurrency.py tests/test_local_bridge.py -v
