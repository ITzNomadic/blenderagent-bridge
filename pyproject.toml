[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blenderagent-bridge"
version = "0.2.1"
description = "Structured, verifiable, and secure MCP control bridge for Blender"
authors = [{ name = "BlenderAgent Team", email = "dev@blenderagent.local" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
]

[project.scripts]
blenderagent-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*"]
exclude = ["addon*", "workspace*", "tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
